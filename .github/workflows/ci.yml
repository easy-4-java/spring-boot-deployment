# CI workflow for easy4j Spring Boot Starter
#
# Triggers:
#   - push / pull_request on all version-line branches
#   - manual workflow_dispatch
#
# JDK matrix by version line:
#   - 2.3.x / 2.7.x : JDK 8
#   - 3.0.x ~ 3.5.x : JDK 17
#   - 4.0.x / 4.1.x : JDK 17 / 21
#
# Stops at test: package binds Docker build/tag and must not run in CI.
name: CI

on:
  push:
    branches: [2.3.x, 2.7.x, 3.0.x, 3.1.x, 3.2.x, 3.3.x, 3.4.x, 3.5.x, 4.0.x, 4.1.x, master, main]
  pull_request:
    branches: [2.3.x, 2.7.x, 3.0.x, 3.1.x, 3.2.x, 3.3.x, 3.4.x, 3.5.x, 4.0.x, 4.1.x, master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: JDK ${{ matrix.java }} Compile & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: [8, 17, 21]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Never advance this lifecycle to package/verify: Docker goals bind to package.
      - name: Compile and run controller regressions (no images)
        run: mvn -B --no-transfer-progress clean test

      - name: Record effective dependency management and actual dependency trees
        run: |
          mvn -B --no-transfer-progress help:effective-pom -Doutput=target/effective-pom.xml
          mvn -B --no-transfer-progress dependency:tree -DoutputFile=target/dependency-tree.txt
          python3 scripts/check-dependency-management.py


      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: |
            **/target/surefire-reports
            **/target/effective-pom.xml
            **/target/dependency-tree.txt
          retention-days: 14
